<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دعوت‌نامه محمد و مانیدا</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eee9e2;
    font-family: Tahoma, Arial, sans-serif;
    overflow: hidden;
  }
  .scene {
    width: min(90vw, 390px);
    height: min(145vw, 630px);
    max-height: 90vh;
    perspective: 1400px;
    cursor: pointer;
  }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
  }
  .front, .inside {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    backface-visibility: hidden;
    box-shadow: 0 18px 45px rgba(0,0,0,.18);
    overflow: hidden;
  }
  .front {
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,.8), transparent 28%),
      linear-gradient(145deg, #faf8f4, #d8d0c7);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 1s cubic-bezier(.2,.8,.2,1), opacity .8s;
    z-index: 2;
  }
  .front::before, .front::after {
    content: "✿";
    position: absolute;
    font-size: 115px;
    color: rgba(130,110,90,.18);
  }
  .front::before { top: 25px; right: 15px; transform: rotate(25deg); }
  .front::after { bottom: 20px; left: 10px; transform: rotate(-25deg); }
  .seal {
    width: 105px;
    height: 105px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #a58b72;
    color: white;
    font-size: 34px;
    box-shadow: 0 8px 20px rgba(0,0,0,.18);
    border: 6px solid rgba(255,255,255,.45);
  }
  .inside {
    background: linear-gradient(150deg, #fffdf9, #eee6dc);
    padding: 48px 28px;
    text-align: center;
    color: #3f3933;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: scale(.96);
    opacity: 0;
    transition: opacity .9s .35s, transform .9s .35s;
  }
  .content { width: 100%; }
  .small {
    font-size: 15px;
    margin-bottom: 30px;
    color: #817468;
  }
  h1 {
    margin: 0 0 18px;
    font-size: 38px;
    font-weight: 500;
  }
  .heart {
    font-size: 26px;
    margin: 8px 0 26px;
  }
  h2 {
    margin: 0 0 18px;
    font-size: 23px;
    font-weight: 600;
  }
  p {
    line-height: 2.2;
    font-size: 16px;
    margin: 0 auto;
    max-width: 310px;
  }
  .open .front {
    transform: rotateY(-180deg);
    opacity: 0;
  }
  .open .inside {
    opacity: 1;
    transform: scale(1);
  }
</style>
</head>
<body>
  <div class="scene" id="scene" aria-label="دعوت‌نامه">
    <div class="card">
      <div class="front">
        <div class="seal">♥</div>
      </div>
      <div class="inside">
        <div class="content">
          <div class="small">به نام عشق</div>
          <h1>محمد و مانیدا</h1>
          <div class="heart">♥</div>
          <h2>جشن عقد و نامزدی</h2>
          <p>
            با عشق و افتخار، شما را به جشن آغاز زندگی مشترکمان دعوت می‌کنیم.
            <br>
            حضورتان گرمی‌بخش این شب به‌یادماندنی ماست.
          </p>
        </div>
      </div>
    </div>
  </div>
<script>
  document.getElementById('scene').addEventListener('click', function () {
    this.classList.add('open');
  });
</script>
</body>
</html>
